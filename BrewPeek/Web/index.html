  <body>
    <main>
      <header>
        <div class="mast"><div class="brand">BREWPEEK</div></div>
        <div class="heading">
          <h1>Installed packages.<br /><span>At a glance.</span></h1>
        </div>
      </header>
      <section class="overview" aria-label="Installation overview" id="overview"></section>
      <p class="note" id="overview-note"></p>
      <div class="toolbar">
        <div class="search-line">
          <label class="searchbox"
            ><span class="search-symbol" aria-hidden="true">⌕</span
            ><span class="sr-only">Search packages</span
            ><input
              id="search"
              type="search"
              aria-label="Search packages"
              autocomplete="off"
              placeholder="Search packages..." /></label
          ><label class="sr-only" for="category">Category</label
          ><select id="category">
            <option value="all">All categories</option>
          </select>
        </div>
        <div class="filter-line">
          <div class="segments" role="group" aria-label="Package filters">
            <button data-filter="all" aria-pressed="true">All</button
            ><button id="updates-filter" data-filter="updates" aria-pressed="false" hidden>
              Updates</button
            ><button data-filter="formula" aria-pressed="false">Formula</button
            ><button data-filter="cask" aria-pressed="false">Cask</button
            ><button data-filter="leaf" aria-pressed="false">Leaf</button
            ><button data-filter="dependency" aria-pressed="false">Dependency</button
            ><button data-filter="direct" aria-pressed="false">Direct</button>
          </div>
          <div class="filter-actions">
            <span id="results" role="status" aria-live="polite"></span
            ><button id="refresh" type="button" title="Refresh (⌘R)" aria-label="Refresh">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 4v6h-6M20 10a8 8 0 1 0-2 8" /></svg
              ><span>Refresh</span>
            </button>
          </div>
        </div>
      </div>
      <div id="operation" aria-live="polite"></div>
      <div id="packages"></div>
      <section class="section environment-panel" id="environment">
        <h2>Environment</h2>
        <dl class="env" id="env"></dl>
        <div class="environment-taps">
          <h3>Additional taps <span class="count" id="tap-count"></span></h3>
          <div id="taps-list"></div>
        </div>
      </section>
      <footer>
        <a
          id="project-link"
          href="https://github.com/kameronkim/brewpeek"
          aria-label="BrewPeek GitHub repository"
          ><span>GitHub</span
          ><svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 12 12 4M4 4h8v8" /></svg></a
        ><span id="footer-updated"></span>
      </footer>
      <noscript><p>Enable JavaScript to view installed packages.</p></noscript>
    </main>
    <script src="inventory.js"></script>
    <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <div class="confirm-heading">
        <div class="eyebrow">PACKAGE UPDATE</div>
        <h2 id="confirm-title" tabindex="-1" autofocus></h2>
        <p id="confirm-copy"></p>
      </div>
      <div id="confirm-error" hidden></div>
      <div class="confirm-scroll" aria-label="Packages to update">
        <table class="confirm-table">
          <colgroup>
            <col style="width: 26%" />
            <col style="width: 37%" />
            <col style="width: 37%" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Current</th>
              <th scope="col">New</th>
            </tr>
          </thead>
          <tbody id="confirm-list"></tbody>
        </table>
      </div>
      <div class="confirm-bottom">
        <p>Homebrew may also update related packages.</p>
        <div class="dialog-actions">
          <button class="subtle-btn" id="cancel">Cancel</button
          ><button class="subtle-btn" id="retry-plan" hidden>Retry</button
          ><button class="update-btn bulk" id="start">Update</button>
        </div>
      </div>
    </dialog>
    <dialog id="notice" aria-labelledby="notice-title">
      <div class="eyebrow">BREWPEEK</div>
      <h2 id="notice-title"></h2>
      <p id="notice-copy"></p>
      <pre id="notice-command" hidden></pre>
      <div class="dialog-actions"><button class="subtle-btn" id="notice-ok">OK</button></div>
    </dialog>
    <script src="inventory-ui.js"></script>
    <script src="updates.js"></script>
  </body>
</html>
